name: Build and Push Docker Image (develop)

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      simulate_candidate_failure:
        description: 'Prueba obligatoria: candidato fallido; green debe seguir atendiendo'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      release_sha: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calcular etiqueta inmutable de UAT
        id: meta
        shell: bash
        run: |
          sha7="${GITHUB_SHA::7}"
          echo "sha7=${sha7}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=uat-${sha7}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          target: runtime
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/kontrol-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/kontrol-backend:${{ steps.meta.outputs.image_tag }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/kontrol-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/kontrol-frontend:${{ steps.meta.outputs.image_tag }}

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.nginx
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/kontrol-nginx:latest
            ${{ secrets.DOCKER_USERNAME }}/kontrol-nginx:${{ steps.meta.outputs.image_tag }}

      - name: Build and push clamd image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.clamd
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/kontrol-clamd:latest
            ${{ secrets.DOCKER_USERNAME }}/kontrol-clamd:${{ steps.meta.outputs.image_tag }}

      - name: Verify UAT images exist
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.image_tag }}"
          registry="${{ secrets.DOCKER_USERNAME }}"
          for image in backend frontend nginx clamd; do
            docker buildx imagetools inspect "${registry}/kontrol-${image}:${tag}" >/dev/null
          done

  deploy-uat:
    needs: build
    if: ${{ vars.UAT_DEPLOY_ENABLED == 'true' }}
    runs-on: [self-hosted, linux, kontrol-uat]
    environment: uat
    concurrency:
      group: kontrol-uat-deploy
      cancel-in-progress: false
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.release_sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Desplegar en UAT
        shell: bash
        run: bash deploy/uat/deploy.sh
        env:
          UAT_IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          UAT_RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
          KONTROL_IMAGE_REGISTRY: ${{ secrets.DOCKER_USERNAME }}
          UAT_SIMULATE_CANDIDATE_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_candidate_failure && '1' || '0' }}
          UAT_REPORT_DIR: ${{ runner.temp }}/kontrol-uat-deploy

      - name: Subir informe de despliegue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-deploy-${{ needs.build.outputs.image_tag }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/kontrol-uat-deploy/manifest.json
            ${{ runner.temp }}/kontrol-uat-deploy/deployments.tsv
            ${{ runner.temp }}/kontrol-uat-deploy/*.sanitized.log
