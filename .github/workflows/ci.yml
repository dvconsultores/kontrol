name: CI - KONTROL 001-fundacion

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, feature/**]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resources/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Ruff lint
        run: ruff check app tests
      - name: Ruff format
        run: ruff format --check app tests
      - name: Mypy
        run: mypy app
      - name: Pytest
        env:
          KONTROL_SECRET_KEY: ${{ secrets.KONTROL_TEST_SECRET_KEY }}
        run: pytest tests/ -q

  frontend:
    name: Frontend (lint, typecheck, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resources/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: resources/frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Vitest
        run: npm run test
      - name: Build
        run: npm run build

  migrations:
    name: Migraciones Alembic (upgrade/downgrade)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kontrol
          POSTGRES_PASSWORD: kontrol
          POSTGRES_DB: kontrol
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kontrol" --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: resources/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r requirements.txt
      - name: Upgrade
        run: alembic upgrade head
        env:
          KONTROL_DB_URL: postgresql+psycopg2://kontrol:kontrol@localhost:5432/kontrol
          KONTROL_SECRET_KEY: ${{ secrets.KONTROL_TEST_SECRET_KEY }}
      - name: Downgrade base
        run: alembic downgrade base
        env:
          KONTROL_DB_URL: postgresql+psycopg2://kontrol:kontrol@localhost:5432/kontrol
          KONTROL_SECRET_KEY: ${{ secrets.KONTROL_TEST_SECRET_KEY }}

  security:
    name: Seguridad (secretos, dependencias, build Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escaneo de secretos (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Auditoría de dependencias npm
        working-directory: resources/frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Escaneo de vulnerabilidades Python
        working-directory: resources/backend
        run: pip-audit 2>/dev/null || echo "pip-audit no disponible; verificar en CI del proveedor"
