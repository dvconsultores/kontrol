# KONTROL - Compose de instalación por cliente (ADR-002, DOC-08 §19).
# Un solo compose para todos los entornos: cambie la etiqueta de imagen
# (KONTROL_IMAGE_TAG). Desarrollo usa "latest" (por defecto); producción "main".
# La base de datos es EXTERNA (cada cliente la suya) vía KONTROL_DB_URL.
# Las migraciones (iniciales y futuras) se aplican automáticamente al
# arrancar el backend (alembic upgrade head en el entrypoint).
# Watchtower actualiza las imágenes automáticamente sin intervención.

name: kontrol

services:
  frontend:
    image: ${KONTROL_IMAGE_REGISTRY:-dvconsultores}/kontrol-frontend:${KONTROL_IMAGE_TAG:-latest}
    container_name: kontrol-web
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - backend
    networks:
      - kontrol-net

  backend:
    image: ${KONTROL_IMAGE_REGISTRY:-dvconsultores}/kontrol-backend:${KONTROL_IMAGE_TAG:-latest}
    container_name: kontrol-api
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      KONTROL_ENVIRONMENT: "${KONTROL_ENVIRONMENT:-prod}"
      KONTROL_IMAGE_TAG: "${KONTROL_IMAGE_TAG:-latest}"
      KONTROL_DB_URL: "${KONTROL_DB_URL:?KONTROL_DB_URL es obligatoria (base de datos externa)}"
      KONTROL_SECRET_KEY: "${KONTROL_SECRET_KEY:?KONTROL_SECRET_KEY es obligatoria}"
      KONTROL_MFA_KEYS: "${KONTROL_MFA_KEYS:?KONTROL_MFA_KEYS es obligatoria (anillo de claves del segundo factor, Spec 002)}"
      KONTROL_COOKIE_SECURE: "true"
      KONTROL_CORS_ORIGINS: "${KONTROL_CORS_ORIGINS:-[\"https://localhost\"]}"
      KONTROL_LICENSE_PUBLIC_KEY_PEM: "${KONTROL_LICENSE_PUBLIC_KEY_PEM:-}"
      KONTROL_INSTALLATION_VOLUME_PATH: "/data/license-state"
      KONTROL_STORAGE_PATH: "/data/storage"
      KONTROL_BACKUP_PATH: "/data/backups"
      KONTROL_LOG_JSON: "true"
      # Analizador antimalware documental (Spec 046 · OBS-09, opción B): el backend transmite cada archivo por
      # INSTREAM al servicio `clamd` de esta misma composición (nombre DNS interno, puerto no publicado). La
      # elección es explícita; si el demonio no responde, la subida se rechaza con SCAN_FAILED (falso seguro):
      # no hay paso a `clamscan` ni a «sin análisis». El backend no lleva binario ni firmas.
      KONTROL_DOCUMENT_SCANNER: "clamd"
      KONTROL_CLAMD_HOST: "clamd"
      KONTROL_CLAMD_PORT: "3310"
      # Cinturón de seguridad, no autoridad: el día de negocio lo decide
      # `app/shared/clock.py`, y el producto es correcto aunque el anfitrión
      # esté en otra zona (Spec 001 · POLICY-CLOCK-LOCAL).
      TZ: "${KONTROL_TZ:-America/Caracas}"
    volumes:
      - kontrol-license-state:/data/license-state
      - kontrol-storage:/data/storage
      - kontrol-backups:/data/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Solo orden de arranque: si clamd cae después, el backend sigue fallando cerrado (SCAN_FAILED), no se oculta.
    depends_on:
      - clamd
    networks:
      - kontrol-net

  # Analizador antimalware (Spec 046 · OBS-09, opción B): un servicio propio, en la red interna, sin puerto
  # publicado y sin acceso al almacén documental. El backend le transmite el contenido por INSTREAM; el demonio
  # es dueño del motor y de las firmas, que `freshclam` (demonio de la imagen oficial) actualiza en el volumen
  # sin reconstruir KONTROL. Imagen `Dockerfile.clamd` = `clamav/clamav:1.4.3` + `deploy/clamd/clamd.conf`
  # (límites 60M ≥ 50 MiB documentales de KONTROL; `AlertExceedsMax`).
  clamd:
    image: ${KONTROL_IMAGE_REGISTRY:-dvconsultores}/kontrol-clamd:${KONTROL_IMAGE_TAG:-latest}
    container_name: kontrol-clamd
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      # Las firmas se actualizan dentro del servicio (freshclam), nunca desde el backend.
      CLAMAV_NO_FRESHCLAMD: "false"
      TZ: "${KONTROL_TZ:-America/Caracas}"
    volumes:
      # Solo la base de firmas: ningún volumen documental ni de respaldos entra aquí.
      - kontrol-clamav-db:/var/lib/clamav
    healthcheck:
      # Contrato real del demonio: PING → PONG por el puerto interno (no «el proceso existe»).
      test: ["CMD-SHELL", "printf 'zPING\\0' | nc -w 5 127.0.0.1 3310 | grep -q PONG"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 3
    networks:
      - kontrol-net

  # Actualización automática (OPT-IN, KAUD-006/P14): solo se inicia si se usa
  # `docker compose --profile watchtower up`. Watchtower detecta una nueva
  # imagen y recrea los contenedores marcados con la etiqueta (rolling restart).
  # Requiere acceso al socket de Docker (privilegio de host). En producción la
  # etiqueta debe fijarse (no "latest"); el entrypoint del backend lo valida.
  watchtower:
    image: containrrr/watchtower
    container_name: kontrol-watchtower
    profiles: ["watchtower"]
    restart: unless-stopped
    environment:
      WATCHTOWER_POLL_INTERVAL: "${KONTROL_AUTO_UPDATE_INTERVAL:-300}"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_STOPPED: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    networks:
      - kontrol-net

volumes:
  kontrol-storage:
  kontrol-license-state:
  kontrol-backups:
  # Firmas antivirus del servicio clamd (dominio operacional del analizador; persisten las actualizaciones).
  kontrol-clamav-db:

networks:
  # Red con nombre fijo para que Nginx Proxy Manager (u otro proxy) pueda
  # unirse y enrutar a kontrol-web:80 y kontrol-api:8000 sin exponer puertos.
  kontrol-net:
    name: kontrol-net
    driver: bridge
    # La base de datos es externa: el backend necesita salida de red para
    # alcanzar el host PostgreSQL del cliente (red interna no aislada).
