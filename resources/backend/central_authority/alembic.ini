# Alembic de la Autoridad Central: base PROPIA (`KONTROL_CENTRAL_DB_URL`), tabla `cla_alembic_version`.
# Uso, desde resources/backend: alembic -c central_authority/alembic.ini upgrade head
[alembic]
script_location = central_authority/alembic
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
