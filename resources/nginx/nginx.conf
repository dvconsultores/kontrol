# KONTROL - Nginx reverse proxy y SPA (DOC-08 §19, NFR-001-001 headers).
server {
    listen 80;
    server_name _;

    # Headers de seguridad (NFR-001-001)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;

    # SPA
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        return 200 '{"status":"ok","service":"frontend"}';
        add_header Content-Type application/json;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# API proxy (usado por el reverse-proxy de entrada; aquí se configura por
# servicio. En instalaciones con TLS, el certificado se monta en kontrol-proxy).
server {
    listen 80;
    server_name api.localhost;

    location /api/v1/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
