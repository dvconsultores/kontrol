# KONTROL · configuración de clamd para el servicio `clamd` de compose.yaml (Spec 046 · OBS-09, opción B).
# Se copia a /etc/clamav/clamd.conf en Dockerfile.clamd sobre la imagen oficial clamav/clamav:1.4.3.
# El backend transmite cada documento por INSTREAM (nunca una ruta): el demonio no monta el almacén documental.
# qa/clamd_qa.py arranca el MISMO fichero (adaptado a un prefijo de usuario) para certificar el contrato.

Foreground yes
LogTime yes
User clamav
DatabaseDirectory /var/lib/clamav

# Escucha solo dentro de la red de la composición: compose.yaml no publica el puerto al anfitrión.
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0

MaxThreads 4
ReadTimeout 120
CommandReadTimeout 30
SelfCheck 600

# Contrato de tamaño: KONTROL admite documentos de hasta 50 MiB (GLOBAL_MAX_SIZE); los límites del demonio deben
# superarlo o un documento legítimo se rechazaría con «INSTREAM size limit exceeded» (medido en OBS-09: con los 25M por
# defecto, 25 MiB + 1 B falla y 50 MiB cierran la conexión). Lo que exceda estos límites NO se da por limpio:
# AlertExceedsMax lo declara como hallazgo (Heuristics.Limits.Exceeded) y KONTROL lo rechaza.
StreamMaxLength 60M
MaxFileSize 60M
MaxScanSize 100M
AlertExceedsMax yes
MaxRecursion 16
MaxFiles 10000
