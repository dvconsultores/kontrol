# KONTROL - Compose de desarrollo (hot reload, correo falso, secretos locales).
name: kontrol-dev

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: dev
    container_name: kontrol-api-dev
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      KONTROL_ENVIRONMENT: "local"
      KONTROL_DB_URL: "postgresql+psycopg2://${KONTROL_DB_USER:-kontrol}:${KONTROL_DB_PASSWORD:-kontrol}@db:5432/${KONTROL_DB_NAME:-kontrol}"
      KONTROL_SECRET_KEY: "${KONTROL_SECRET_KEY:-dev-secret-key-0123456789abcdef0123456789abcdef}"
      KONTROL_COOKIE_SECURE: "false"
      KONTROL_CORS_ORIGINS: "http://localhost:5173"
      KONTROL_INSTALLATION_VOLUME_PATH: "/data/license-state"
      KONTROL_STORAGE_PATH: "/data/storage"
      KONTROL_BACKUP_PATH: "/data/backups"
      KONTROL_LOG_JSON: "false"
    volumes:
      - ./resources/backend/app:/app/app
      - ./resources/backend/alembic:/app/alembic
      - kontrol-dev-license:/data/license-state
      - kontrol-dev-storage:/data/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kontrol-dev-net

  frontend:
    image: node:20-alpine
    container_name: kontrol-web-dev
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      KONTROL_API_URL: "http://backend:8000"
    volumes:
      - ./resources/frontend:/app
      - kontrol-dev-node:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - kontrol-dev-net

  db:
    image: postgres:18-alpine
    container_name: kontrol-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${KONTROL_DB_USER:-kontrol}"
      POSTGRES_PASSWORD: "${KONTROL_DB_PASSWORD:-kontrol}"
      POSTGRES_DB: "${KONTROL_DB_NAME:-kontrol}"
    volumes:
      - kontrol-dev-db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KONTROL_DB_USER:-kontrol} -d ${KONTROL_DB_NAME:-kontrol}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kontrol-dev-net

volumes:
  kontrol-dev-db:
  kontrol-dev-license:
  kontrol-dev-storage:
  kontrol-dev-node:

networks:
  kontrol-dev-net:
    driver: bridge
